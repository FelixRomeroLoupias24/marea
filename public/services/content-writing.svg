<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Ilustración de redacción de artículos para blog">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#312e81" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1390" cy="140" r="210" fill="#c7d2fe" opacity="0.55"/>
  <circle cx="170" cy="790" r="180" fill="#d1fae5" opacity="0.7"/>

  <!-- Hoja de artículo -->
  <g filter="url(#shadow)">
    <rect x="430" y="130" width="620" height="660" rx="28" fill="#ffffff"/>
  </g>
  <rect x="490" y="200" width="150" height="26" rx="13" fill="#d1fae5"/>
  <rect x="490" y="260" width="460" height="34" rx="10" fill="#111827"/>
  <rect x="490" y="310" width="340" height="34" rx="10" fill="#111827"/>
  <rect x="490" y="380" width="500" height="150" rx="16" fill="#c7d2fe"/>
  <path d="M520 505 L610 440 L680 480 L780 410 L960 505 Z" fill="#818cf8"/>
  <circle cx="900" cy="430" r="26" fill="#f59e0b"/>
  <g fill="#e5e7eb">
    <rect x="490" y="570" width="500" height="16" rx="8"/>
    <rect x="490" y="606" width="470" height="16" rx="8"/>
    <rect x="490" y="642" width="500" height="16" rx="8"/>
    <rect x="490" y="678" width="330" height="16" rx="8"/>
  </g>

  <!-- Lápiz -->
  <g transform="rotate(-38 1180 560)">
    <rect x="1120" y="300" width="64" height="420" rx="14" fill="#4f46e5"/>
    <rect x="1120" y="300" width="64" height="58" rx="14" fill="#f59e0b"/>
    <rect x="1120" y="350" width="64" height="16" fill="#e5e7eb"/>
    <path d="M1120 718 L1184 718 L1152 790 Z" fill="#fde68a"/>
    <path d="M1141 765 L1163 765 L1152 790 Z" fill="#111827"/>
  </g>

  <!-- Tarjeta de métricas -->
  <g filter="url(#shadow)">
    <rect x="1110" y="560" width="300" height="190" rx="24" fill="#ffffff"/>
  </g>
  <rect x="1145" y="595" width="120" height="18" rx="9" fill="#e5e7eb"/>
  <g fill="#10b981">
    <rect x="1150" y="690" width="34" height="34" rx="8"/>
    <rect x="1200" y="665" width="34" height="59" rx="8"/>
    <rect x="1250" y="645" width="34" height="79" rx="8"/>
    <rect x="1300" y="625" width="34" height="99" rx="8"/>
  </g>
  <rect x="1350" y="606" width="34" height="118" rx="8" fill="#4f46e5"/>

  <!-- Burbujas de ideas -->
  <g filter="url(#shadow)">
    <rect x="160" y="210" width="220" height="120" rx="24" fill="#ffffff"/>
  </g>
  <rect x="195" y="245" width="150" height="16" rx="8" fill="#c7d2fe"/>
  <rect x="195" y="277" width="100" height="16" rx="8" fill="#e5e7eb"/>
  <g filter="url(#shadow)">
    <circle cx="300" cy="500" r="74" fill="#ffffff"/>
  </g>
  <path d="M268 500 L292 524 L336 476" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
